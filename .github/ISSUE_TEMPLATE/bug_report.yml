name: Bug report
description: Something is broken or behaves differently than you expected.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not paste API keys, tokens or real bookmarks.
        For security vulnerabilities, do not open an issue. See the security policy instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem, including any error message you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that triggers the problem.
      placeholder: |
        1. Run ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: where-it-runs
    attributes:
      label: Where does it run?
      options:
        - Local (npm run dev)
        - Render
        - Vercel
        - Other
    validations:
      required: true
  - type: dropdown
    id: voice-provider
    attributes:
      label: Voice provider
      options:
        - Grok Voice
        - ElevenLabs
        - Markdown only
    validations:
      required: true
  - type: textarea
    id: setup-check
    attributes:
      label: Output of `npm run setup -- --check`
      description: Paste the output with any keys, tokens and project ids removed.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you submit
      options:
        - label: I have removed all API keys and personal data from this report.
          required: true
