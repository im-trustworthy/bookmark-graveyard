name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the privacy sweep reads every commit

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A pull request is checked on its own commits; main on all of its history.
      - name: Privacy sweep
        run: |
          if [ -n "$PR_BASE" ]; then npm run sweep -- "$PR_HEAD" --since "$PR_BASE"; else npm run sweep; fi
        env:
          PRIVACY_SWEEP_PATTERNS: ${{ secrets.PRIVACY_SWEEP_PATTERNS }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
